name: Migrar fontes financeiras legadas para master

on:
  push:
    branches: [master]
    paths:
      - migration/sources.json
      - scripts/migrate_legacy.py
      - scripts/backup_legacy.sh
      - .github/workflows/migrate-legacy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotacoes-legacy-migration-master
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.repository == '0rakul0/cotacoes_backEnd'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Fixar e copiar arquivos de seis origens
        run: python scripts/migrate_legacy.py
      - name: Conferir hashes e integridade do snapshot
        run: python scripts/migrate_legacy.py --verify-only
      - name: Instalar dependencias de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes locais e compilar modulos
        run: |
          python -m compileall -q main.py cotacoes tests scripts/migrate_legacy.py
          python -m pytest -q
          node --check frontend/app.js
      - name: Salvar snapshot auditado diretamente na master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- legacy_sources
          # Arquivos legados sao preservados literalmente, inclusive espacos antigos.
          if git diff --cached --quiet; then
            echo "Snapshot ja esta sincronizado."
          else
            git commit -m "chore(migration): preserve pinned legacy source snapshots"
            git push origin HEAD:master
          fi
